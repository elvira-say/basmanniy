<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>История Басманного района</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --paper:#efe8d6; --paper-2:#e4dcc5; --rule:#cfc6ae; --ink:#1c1e1a; --muted:#4b4d44; --green:#233e2a;
  --serif:'PT Serif',Georgia,serif; --display:'Old Standard TT',Georgia,serif; --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{display:flex;flex-direction:column;flex:1;padding:16px 20px 22px;gap:14px}
.top{display:flex;flex-direction:column;gap:8px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.06em}
.linkbtn{background:none;border:0;padding:8px 0;font-family:var(--sans);font-weight:600;font-size:13px;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.bar{display:grid;gap:3px}
.bar i{display:block;height:4px;background:var(--rule)}
.bar i.on{background:var(--green)}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.08}
h1{font-size:34px} h2{font-size:26px}
.kicker{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--green)}
.meta{font-size:15px;line-height:1.45}
.note{font-size:13px;line-height:1.45;color:var(--muted)}
p{margin:0;font-size:16px;line-height:1.55}
.story p+p{margin-top:12px}
figure{margin:0;border:1px solid var(--ink);padding:6px;position:relative;background:var(--paper)}
figure img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover}
figure.tall img{max-height:300px;object-fit:contain;background:var(--paper-2)}
figcaption{font-family:var(--display);font-style:italic;font-size:12.5px;color:var(--muted);padding:6px 2px 0}
.stamp{position:absolute;top:16px;right:14px;transform:rotate(-6deg);border:3px solid var(--green);color:var(--green);background:rgba(239,232,214,.92);padding:3px 10px;font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:.08em}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:12px;background:var(--green);color:var(--paper);font-family:var(--sans);font-weight:800;font-size:16px;letter-spacing:.02em;cursor:pointer;text-decoration:none;padding:0 16px;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.dark{background:var(--ink)}
.actions{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{min-height:50px;border:1.5px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font-family:var(--serif);font-size:16px;text-align:left;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.opt.right{background:var(--green);border-color:var(--green);color:var(--paper);font-weight:700}
.opt.wrong{border-style:dashed;color:var(--muted);text-decoration:line-through}
.opt:disabled{cursor:default}
.after{font-size:14.5px;line-height:1.5;background:var(--paper-2);padding:12px 14px;border-radius:8px}
.toggle{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.toggle button{min-height:44px;border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:800}
.route{list-style:none;margin:0;padding:0}
.route li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:8px 0;position:relative}
.route li::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:2px;background:var(--rule)}
.route li:first-child::before{top:20px}.route li:last-child::before{bottom:calc(100% - 20px)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800;font-size:13px}
.dot.done{background:var(--green);border-color:var(--green);color:var(--paper)}
.dot.lost{text-decoration:line-through}
.dot.threat{border:4px double var(--green)}
.dot.here{outline:3px solid var(--green);outline-offset:2px}
.route b{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.route span{font-size:13px;color:var(--muted)}
.bigstamp{align-self:center;max-width:90%;margin:24px 0 8px;transform:rotate(-6deg);border:4px solid var(--green);color:var(--green);padding:10px 16px;font-family:var(--sans);font-weight:800;font-size:clamp(18px,5.6vw,26px);letter-spacing:.08em;text-align:center}
@media (prefers-reduced-motion:no-preference){.bigstamp{animation:press .45s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes press{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.card{background:var(--green);color:var(--paper);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:32px}
.seals{display:grid;grid-template-columns:repeat(6,44px);justify-content:space-between;row-gap:10px}
.seal{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-weight:800;font-size:14px;border:2px solid var(--paper)}
.seal.saved{background:var(--paper);color:var(--green)}
.seal.lost{text-decoration:line-through}
.seal.threat{border:4px double var(--paper)}
.seal.future{border-style:dashed}
.legend{font-size:12.5px;line-height:1.5;opacity:.92}
.cardfoot{border-top:1px solid rgba(239,232,214,.5);padding-top:12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--display);font-style:italic;font-size:15px}
.cardfoot span{font-family:var(--sans);font-style:normal;font-weight:600;font-size:12px;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deeds{display:flex;flex-direction:column}
.deed{border-top:1px solid var(--rule);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.deed:last-child{border-bottom:1px solid var(--rule)}
.deed b{font-family:var(--display);font-size:18px}
.deed .linkbtn{align-self:flex-start;padding:4px 0}
.overlay{position:fixed;inset:0;background:rgba(28,30,26,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:10}
.overlay img{max-width:100%;max-height:72vh;border-radius:10px}
.overlay p{color:var(--paper);text-align:center;font-size:14px}
.logo{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block}
.cover-title{font-size:36px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li{font-size:16px;line-height:1.45}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.hidden{display:none !important}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
